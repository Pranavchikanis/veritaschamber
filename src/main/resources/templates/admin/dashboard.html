<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-fragments :: adminHead('Dashboard | Veritas Chambers Admin')}"></head>
<body>
    
    <div th:replace="~{admin/fragments/admin-fragments :: adminSidebar('dashboard')}"></div>

    <main>
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Dashboard</h1>
        </div>

        <div id="dashboard-loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="dashboard-content" class="d-none">
            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4 mb-4">
                
                <div class="col">
                    <div class="card shadow-sm border-0 border-start border-primary border-4 h-100">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <h6 class="text-muted fw-normal mb-1">New Consultations</h6>
                                    <h3 class="mb-0 fw-bold" id="metric-consultations">-</h3>
                                </div>
                                <div class="bg-primary bg-opacity-10 text-primary p-3 rounded">
                                    <i class="fa-solid fa-calendar-check fs-4"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card shadow-sm border-0 border-start border-success border-4 h-100">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <h6 class="text-muted fw-normal mb-1">New Messages</h6>
                                    <h3 class="mb-0 fw-bold" id="metric-messages">-</h3>
                                </div>
                                <div class="bg-success bg-opacity-10 text-success p-3 rounded">
                                    <i class="fa-solid fa-envelope fs-4"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card shadow-sm border-0 border-start border-info border-4 h-100">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <h6 class="text-muted fw-normal mb-1">Published Articles</h6>
                                    <h3 class="mb-0 fw-bold" id="metric-articles">-</h3>
                                </div>
                                <div class="bg-info bg-opacity-10 text-info p-3 rounded">
                                    <i class="fa-solid fa-newspaper fs-4"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            
            <div class="row">
                <div class="col-12 col-xl-6 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
                            <h5 class="mb-0 fw-bold">Recent Consultations</h5>
                            <a href="/admin/consultations" class="btn btn-sm btn-outline-secondary">View All</a>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Name</th>
                                            <th>Date</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="recent-consultations-body">
                                        <!-- Rows injected here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-12 col-xl-6 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
                            <h5 class="mb-0 fw-bold">Recent Messages</h5>
                            <a href="/admin/contact-messages" class="btn btn-sm btn-outline-secondary">View All</a>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Name</th>
                                            <th>Date</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="recent-messages-body">
                                        <!-- Rows injected here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/admin/admin-core.js}"></script>
    <script th:src="@{/js/admin/dashboard.js}"></script>
</body>
</html>
