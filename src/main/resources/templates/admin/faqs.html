<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-fragments :: adminHead('FAQs | Veritas Chambers Admin')}"></head>
<body>
    
    <div th:replace="~{admin/fragments/admin-fragments :: adminSidebar('faqs')}"></div>

    <main>
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Frequently Asked Questions</h1>
            <button class="btn btn-primary" id="btn-add-new">
                <i class="fa-solid fa-plus me-1"></i> Add FAQ
            </button>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="content" class="d-none">
            
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Order</th>
                                    <th>Question</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="data-table-body">
                                <!-- Rows injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <nav aria-label="Page navigation" id="pagination-container" class="d-none">
                <ul class="pagination justify-content-center" id="pagination-ul">
                    <!-- Pagination injected here -->
                </ul>
            </nav>

        </div>

        <!-- Add/Edit Modal -->
        <div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalLabel" aria-hidden="true" data-bs-backdrop="static">
            <div class="modal-dialog modal-lg">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="itemModalLabel">FAQ Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="item-form">
                        <div class="modal-body bg-light">
                            <input type="hidden" id="modal-id">
                            
                            <div class="mb-3">
                                <label for="modal-question" class="form-label">Question <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="modal-question" required>
                            </div>

                            <div class="mb-3">
                                <label for="modal-answer" class="form-label">Answer <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="modal-answer" rows="4" required></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="modal-order" class="form-label">Display Order</label>
                                    <input type="number" class="form-control" id="modal-order" value="0">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="modal-status" class="form-label">Status</label>
                                    <select class="form-select" id="modal-status">
                                        <option value="true">Active (Visible)</option>
                                        <option value="false">Inactive (Hidden)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="save-item-btn">Save FAQ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title">Confirm Deletion</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        Are you sure you want to delete this FAQ?
                        <input type="hidden" id="delete-id">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/admin/admin-core.js}"></script>
    <script th:src="@{/js/admin/faqs.js}"></script>
</body>
</html>
