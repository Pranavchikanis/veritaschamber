<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-fragments :: adminHead('Settings | Veritas Chambers Admin')}"></head>
<body>
    
    <div th:replace="~{admin/fragments/admin-fragments :: adminSidebar('settings')}"></div>

    <main>
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Website Settings</h1>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="content" class="d-none">
            
            <div class="card shadow-sm border-0 mb-4" style="max-width: 800px;">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Global Configuration</h5>
                </div>
                <div class="card-body">
                    <form id="settings-form">
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="contactEmail" class="form-label">Contact Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="contactEmail" required>
                            </div>
                            <div class="col-md-6">
                                <label for="contactPhone" class="form-label">Contact Phone <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="contactPhone" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="officeAddress" class="form-label">Office Address <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="officeAddress" rows="3" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="officeHours" class="form-label">Office Hours</label>
                            <input type="text" class="form-control" id="officeHours">
                        </div>

                        <hr class="my-4">

                        <h6 class="fw-bold mb-3">Social Links</h6>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="linkedinUrl" class="form-label"><i class="fa-brands fa-linkedin text-primary me-1"></i> LinkedIn URL</label>
                                <input type="url" class="form-control" id="linkedinUrl" placeholder="https://linkedin.com/...">
                            </div>
                            <div class="col-md-6">
                                <label for="twitterUrl" class="form-label"><i class="fa-brands fa-twitter text-info me-1"></i> Twitter URL</label>
                                <input type="url" class="form-control" id="twitterUrl" placeholder="https://twitter.com/...">
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-primary" id="save-settings-btn">Save Settings</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/admin/admin-core.js}"></script>
    <script th:src="@{/js/admin/settings.js}"></script>
</body>
</html>
