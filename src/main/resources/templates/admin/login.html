<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-fragments :: adminHead('Admin Login | Veritas Chambers')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h1 class="h3 mb-3 fw-bold" style="font-family: 'Libre Baskerville', serif;">Veritas Chambers</h1>
                <p class="text-muted">Administrator Login</p>
            </div>

            <div id="login-error" class="alert alert-danger d-none" role="alert">
                Invalid email or password.
            </div>

            <form id="login-form">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">Email address</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                <button class="w-100 btn btn-lg btn-dark" type="submit" id="login-submit">
                    Sign in
                </button>
            </form>
            <div class="text-center mt-4">
                <a href="/" class="text-muted text-decoration-none small"><i class="fa-solid fa-arrow-left me-1"></i> Return to Public Site</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/admin/login.js}"></script>
</body>
</html>
