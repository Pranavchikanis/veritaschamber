<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Admin Head -->
<head th:fragment="adminHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <title th:text="${title}">Veritas Chambers | Admin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom Admin CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<!-- Admin Sidebar -->
<th:block th:fragment="adminSidebar(activeItem)">
    <!-- Mobile topbar -->
    <div class="d-md-none d-flex align-items-center bg-dark text-white p-3 fixed-top shadow-sm" style="z-index: 1040; height: 60px;">
        <button id="sidebarToggle" class="btn btn-dark text-white me-3 border-0 bg-transparent p-0 shadow-none"><i class="fa-solid fa-bars fs-4"></i></button>
        <span class="fs-5 fw-bold" style="font-family: 'Libre Baskerville', serif;">Veritas Chambers</span>
    </div>
    
    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay d-md-none"></div>

    <div id="adminSidebar" class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark sidebar" style="width: 250px; min-height: 100vh;">
        <a href="/admin/dashboard" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <span class="fs-5 fw-bold" style="font-family: 'Libre Baskerville', serif;">Veritas Chambers</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="/admin/dashboard" class="nav-link text-white" th:classappend="${activeItem == 'dashboard'} ? 'active' : ''">
                    <i class="fa-solid fa-gauge me-2"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="/admin/consultations" class="nav-link text-white" th:classappend="${activeItem == 'consultations'} ? 'active' : ''">
                    <i class="fa-solid fa-calendar-check me-2"></i> Consultations
                </a>
            </li>
            <li>
                <a href="/admin/contact-messages" class="nav-link text-white" th:classappend="${activeItem == 'contact-messages'} ? 'active' : ''">
                    <i class="fa-solid fa-envelope me-2"></i> Contact Messages
                </a>
            </li>
            <li>
                <a href="/admin/practice-areas" class="nav-link text-white" th:classappend="${activeItem == 'practice-areas'} ? 'active' : ''">
                    <i class="fa-solid fa-scale-balanced me-2"></i> Practice Areas
                </a>
            </li>
            <li>
                <a href="/admin/articles" class="nav-link text-white" th:classappend="${activeItem == 'articles'} ? 'active' : ''">
                    <i class="fa-solid fa-newspaper me-2"></i> Legal Insights
                </a>
            </li>
            <li>
                <a href="/admin/faqs" class="nav-link text-white" th:classappend="${activeItem == 'faqs'} ? 'active' : ''">
                    <i class="fa-solid fa-circle-question me-2"></i> FAQs
                </a>
            </li>

            <li>
                <a href="/admin/settings" class="nav-link text-white" th:classappend="${activeItem == 'settings'} ? 'active' : ''">
                    <i class="fa-solid fa-gear me-2"></i> Settings
                </a>
            </li>
        </ul>
        <hr>
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fa-solid fa-user-circle fs-4 me-2"></i>
                <strong id="admin-user-name">Admin</strong>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                <li><a class="dropdown-item" href="/" target="_blank">View Public Site</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#" id="logout-btn">Sign out</a></li>
            </ul>
        </div>
    </div>
</th:block>

</html>
