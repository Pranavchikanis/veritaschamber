<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('About Us | Veritas Chambers')}"></head>
<body class="d-flex flex-column min-vh-100">
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="flex-grow-1">
        
        <!-- Header -->
        <section class="vc-section bg-light py-5">
            <div class="container py-4 text-center">
                <h1 class="display-4 fw-bold mb-3" style="font-family: var(--vc-font-serif);">About Veritas Chambers</h1>
                <p class="lead text-muted" style="max-width: 700px; margin: 0 auto;">
                    A disciplined legal practice grounded in truth, precision, and integrity.
                </p>
            </div>
        </section>

        <!-- Profile Section -->
        <section class="vc-section">
            <div class="container py-5 vc-content-narrow">
                
                <div class="row mb-5" id="about-profile-container">
                    <div class="col-12 text-center py-5" id="about-profile-loading">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
                
                <div id="about-profile-error" class="alert alert-danger d-none">
                    Failed to load profile details.
                </div>
                
            </div>
        </section>
        
        <!-- CTA Section -->
        <section class="vc-section bg-light">
            <div class="container py-5 text-center">
                <h2 class="h3 mb-4">Schedule a Consultation</h2>
                <p class="lead text-muted mb-4">Discuss your legal matter with our office.</p>
                <a href="/contact" class="btn btn-primary vc-btn-primary btn-lg px-5">Contact Us</a>
            </div>
        </section>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script defer th:src="@{/js/api.js}"></script>
    <script defer th:src="@{/js/main.js}"></script>
    <script defer th:src="@{/js/components/navigation.js}"></script>
    <script defer th:src="@{/js/pages/about.js}"></script>
</body>
</html>
